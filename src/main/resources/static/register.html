<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Smart Job Placement System</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-logo">💼</div>
            <h1>Create Account</h1>
            <p>Join Smart Job Placement System</p>
        </div>

        <div id="errorBox" class="alert alert-error" style="display:none;"></div>
        <div id="successBox" class="alert alert-success" style="display:none;"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required minlength="2" maxlength="100">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="role">Register As</label>
                <select id="role" required>
                    <option value="STUDENT">Student</option>
                    <option value="ADMIN">Admin / Placement Officer</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login.html">Login here</a></p>
        </div>

    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
