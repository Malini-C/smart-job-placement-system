# ═══════════════════════════════════════════════════════════
# SPRING APPLICATION
# ═══════════════════════════════════════════════════════════
spring.application.name=smart-job-placement-system

# ═══════════════════════════════════════════════════════════
# DATABASE — Uses env vars on Railway, defaults locally
# ═══════════════════════════════════════════════════════════
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Tom@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000

# ═══════════════════════════════════════════════════════════
# JPA/HIBERNATE
# ═══════════════════════════════════════════════════════════
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ═══════════════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════════════
logging.level.org.hibernate.SQL=WARN
logging.level.com.placementsystem=INFO

# ═══════════════════════════════════════════════════════════
# JWT
# ═══════════════════════════════════════════════════════════
jwt.secret=${JWT_SECRET:U2VjcmV0S2V5Rm9ySldUR2VuZXJhdGlvbjEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3OA==}
jwt.expiration=86400000

# ═══════════════════════════════════════════════════════════
# SERVER — Railway sets $PORT automatically
# ═══════════════════════════════════════════════════════════
server.port=${PORT:8080}

# ═══════════════════════════════════════════════════════════
# CORS
# ═══════════════════════════════════════════════════════════
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Content-Type,X-Requested-With
cors.allow-credentials=true
cors.max-age=3600