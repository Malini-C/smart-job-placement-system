# ========================================
# APPLICATION CONFIGURATION
# ========================================
spring.application.name=smart-job-placement-system
server.port=8080

# ========================================
# DATABASE CONFIGURATION
# ========================================
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/placement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Tom@123

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA/HIBERNATE CONFIGURATION
# ========================================
# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Create tables automatically (update = alter, create = delete & create)
spring.jpa.hibernate.ddl-auto=update

# Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# JWT CONFIGURATION
# ========================================
# Secret key for JWT (use a strong key in production)
jwt.secret=SecretKeyForJWTGeneration12345678901234567890
jwt.expiration=86400000

# ========================================
# CORS CONFIGURATION
# ========================================
# Allow frontend to access APIs
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS